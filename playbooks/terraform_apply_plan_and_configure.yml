---
- import_playbook: terraform_apply_plan.yml

- name: Configure provisioned EC2 instances with Nginx
  hosts: all
  gather_facts: false
  vars:
    ec2_ssh_user: "{{ input_ec2_ssh_user | default('ec2-user') }}"
    ec2_ssh_private_key_file: "{{ input_ec2_ssh_private_key_file }}"
    dynamic_inventory_path: "{{ input_dynamic_inventory_path | default('/tmp/provisioned_ec2_inventory.ini') }}"
  tasks:

  - name: Validate SSH private key path is provided for EC2 configuration
    ansible.builtin.assert:
      that:
        - ec2_ssh_private_key_file is defined
        - ec2_ssh_private_key_file | length > 0
      fail_msg: >
        Set extra var input_ec2_ssh_private_key_file to the private key file
        that matches aws_instance_public_key.

  - name: Retrieve instance IPs from Terraform outputs
    hashicorp.terraform.output:
      tf_hostname: "{{ tf_hostname }}"
      tf_validate_certs: false
      tf_token: "{{ tf_token }}"
      organization: "{{ tf_org }}"
      workspace: "{{ tf_workspace }}"
      name: instance_ip_addr
    register: tf_instance_ips

  - name: Set instance IP list from Terraform output
    ansible.builtin.set_fact:
      instance_ips: "{{ tf_instance_ips.output.value }}"

  - name: Ensure at least one instance IP was returned
    ansible.builtin.assert:
      that:
        - instance_ips | length > 0
        - instance_ips[0] | length > 0
      fail_msg: "Terraform apply completed but no instance IPs were found in output 'instance_ip_addr'."

  - name: Generate dynamic inventory for provisioned EC2 hosts
    ansible.builtin.template:
      src: templates/provisioned_ec2_inventory.ini.j2
      dest: "{{ dynamic_inventory_path }}"
      mode: '0600'

  - name: Run Nginx configuration playbook on provisioned EC2 instances
    ansible.builtin.command:
      argv:
        - ansible-playbook
        - "-i"
        - "{{ dynamic_inventory_path }}"
        - "{{ playbook_dir }}/install_nginx-rhel.yml"
    environment:
      ANSIBLE_HOST_KEY_CHECKING: "False"
    changed_when: true
