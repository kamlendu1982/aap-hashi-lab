---
- import_playbook: terraform_apply_plan.yml

- name: Register provisioned EC2 instances for configuration
  hosts: all
  gather_facts: false
  tasks:

  - name: Retrieve instance IPs from Terraform outputs
    hashicorp.terraform.output:
      tf_hostname: "{{ tf_hostname }}"
      tf_validate_certs: false
      tf_token: "{{ tf_token }}"
      organization: "{{ tf_org }}"
      workspace: "{{ tf_workspace }}"
      name: instance_ip_addr
    register: tf_instance_ips

  - name: Set instance IP list from Terraform output
    ansible.builtin.set_fact:
      instance_ips: "{{ tf_instance_ips.output.value }}"

  - name: Ensure at least one instance IP was returned
    ansible.builtin.assert:
      that:
        - instance_ips | length > 0
        - instance_ips[0] | length > 0
      fail_msg: "Terraform apply completed but no instance IPs were found in output 'instance_ip_addr'."

  - name: Add provisioned EC2 instances to in-memory inventory
    ansible.builtin.add_host:
      name: "{{ aws_name_tag | default('ec2') }}-{{ idx + 1 }}"
      ansible_host: "{{ item }}"
      ansible_user: "{{ input_ec2_ssh_user | default(ansible_user | default('ec2-user')) }}"
      ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file | default(omit) }}"
      groups: provisioned_ec2
    loop: "{{ instance_ips }}"
    loop_control:
      index_var: idx

- name: Deploy Parasol Insurance Website to provisioned EC2 instances
  hosts: provisioned_ec2
  become: true
  gather_facts: false
  vars:
    website_url: "https://github.com/ansible-tmm/parasol-website"
    nginx_root: "/usr/share/nginx/html"

  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Add swap if none exists
      ansible.builtin.shell: |
        if ! swapon --show | grep -q .; then
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
        fi
      changed_when: false

    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Clear and recreate nginx web root
      ansible.builtin.file:
        path: "{{ nginx_root }}"
        state: "{{ item }}"
        mode: '0755'
        owner: root
        group: root
      loop:
        - absent
        - directory

    - name: Download and extract website
      ansible.builtin.unarchive:
        src: "{{ website_url }}/archive/refs/heads/main.tar.gz"
        dest: "{{ nginx_root }}"
        remote_src: true
        extra_opts: ['--strip-components=1']
        owner: root
        group: root

    - name: Restore SELinux contexts on web root
      ansible.builtin.command: restorecon -Rv {{ nginx_root }}
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true
