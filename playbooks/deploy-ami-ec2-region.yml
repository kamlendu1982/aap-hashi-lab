---
# Deploy a backup AMI into another AWS region (regional migration).
#
# Typical flow:
#   1. create-ami-ec2-bkp.yml  (source region) -> source_ami_id
#   2. This playbook            (target region) -> new EC2 with same disk/app data
#   3. Cut over to new public IP, then destroy old region stack
#
# Required extra vars / survey:
#   source_ami_id         From create-ami job via workflow set_stats, or survey/extra var
#   aws_source_region     Source region (workflow set_stats or aws_region extra var)
#   aws_target_region     Region to deploy into (e.g. us-east-1)
#   aws_name_tag          Name prefix (matches Terraform lab)
#   aws_instance_public_key
#   aws_instance_size     e.g. t3.medium
#
# Optional:
#   skip_ami_copy: true    Use target_ami_id instead of copying again
#   target_ami_id          Already-copied AMI in aws_target_region
#   aws_target_vpc_id      Default VPC used if omitted
#   aws_target_subnet_id   Default public subnet used if omitted
#   migrated_instance_name default: instance-1
#
# Collections: amazon.aws, community.aws (ec2_ami_copy)
# Credential: Amazon AWS on the job template

- name: Deploy migrated AMI to a target AWS region
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_source_region: "{{ aws_source_region | default(aws_region) }}"
    migrated_instance_name: "{{ input_migrated_instance_name | default('instance-1') }}"
    resource_prefix: "{{ aws_name_tag }}"
    security_group_name: "{{ resource_prefix }}-sg"
    key_pair_name: "{{ resource_prefix }}-keypair"
    instance_name_tag: "{{ resource_prefix }}-{{ migrated_instance_name }}"
    ami_copy_name: "{{ ami_name_prefix | default(resource_prefix ~ '-migrated') }}-{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
    do_copy_ami: "{{ not (skip_ami_copy | default(false) | bool) }}"

  tasks:
    - name: Validate required migration variables
      ansible.builtin.assert:
        that:
          - source_ami_id is defined
          - source_ami_id | length > 0
          - aws_source_region is defined
          - aws_source_region | length > 0
          - aws_target_region is defined
          - aws_target_region | length > 0
          - aws_name_tag is defined
          - aws_name_tag | length > 0
          - aws_instance_public_key is defined
          - aws_instance_public_key | length > 0
          - aws_instance_size is defined
          - aws_instance_size | length > 0
          - aws_source_region != aws_target_region
          - (do_copy_ami | bool) or (target_ami_id is defined and target_ami_id | length > 0)
        fail_msg: >
          Provide source_ami_id, aws_source_region, aws_target_region, aws_name_tag,
          aws_instance_public_key, aws_instance_size. Regions must differ.
          When skip_ami_copy=true, also provide target_ami_id.

    - name: Copy AMI from source region to target region
      community.aws.ec2_ami_copy:
        source_region: "{{ aws_source_region }}"
        source_image_id: "{{ source_ami_id }}"
        region: "{{ aws_target_region }}"
        name: "{{ ami_copy_name }}"
        description: "Regional copy of {{ source_ami_id }} from {{ aws_source_region }}"
        wait: true
        wait_timeout: "{{ ami_copy_wait_timeout | default(1200) }}"
        tags:
          Name: "{{ ami_copy_name }}"
          SourceAMI: "{{ source_ami_id }}"
          SourceRegion: "{{ aws_source_region }}"
          CreatedBy: AAP
      register: ami_copy_result
      when: do_copy_ami | bool

    - name: Use pre-copied target AMI
      ansible.builtin.set_fact:
        deploy_ami_id: "{{ target_ami_id }}"
      when: not (do_copy_ami | bool)

    - name: Set deployed AMI id from copy result
      ansible.builtin.set_fact:
        deploy_ami_id: "{{ ami_copy_result.image_id }}"
      when: do_copy_ami | bool

    - name: Look up default VPC in target region
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_target_region }}"
        filters:
          is-default: "true"
      register: target_default_vpc
      when: aws_target_vpc_id is not defined or (aws_target_vpc_id | string | trim | length == 0)

    - name: Use supplied target VPC id
      ansible.builtin.set_fact:
        deploy_vpc_id: "{{ aws_target_vpc_id | string | trim }}"
      when: aws_target_vpc_id is defined and (aws_target_vpc_id | string | trim | length > 0)

    - name: Use default VPC in target region
      ansible.builtin.set_fact:
        deploy_vpc_id: "{{ target_default_vpc.vpcs[0].vpc_id }}"
      when:
        - deploy_vpc_id is not defined or deploy_vpc_id | length == 0
        - target_default_vpc is not skipped
        - target_default_vpc.vpcs | length > 0

    - name: Fail when no VPC is available in target region
      ansible.builtin.fail:
        msg: |
          No VPC available for region {{ aws_target_region }}.

          Set extra var aws_target_vpc_id to a VPC in that region (for example vpc-0123456789abcdef0).

          Default VPC lookup found {{ target_default_vpc.vpcs | default([]) | length }} default VPC(s).
          Many AWS accounts do not have a default VPC in every region.
      when: deploy_vpc_id is not defined or deploy_vpc_id | length == 0

    - name: Look up subnets in target VPC
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_target_region }}"
        filters:
          vpc-id: "{{ deploy_vpc_id }}"
      register: target_subnets
      when: aws_target_subnet_id is not defined or (aws_target_subnet_id | string | trim | length == 0)

    - name: Use supplied target subnet id
      ansible.builtin.set_fact:
        deploy_subnet_id: "{{ aws_target_subnet_id | string | trim }}"
      when: aws_target_subnet_id is defined and (aws_target_subnet_id | string | trim | length > 0)

    - name: Select first public subnet in target VPC
      ansible.builtin.set_fact:
        deploy_subnet_id: >-
          {{
            target_subnets.subnets
            | selectattr('map_public_ip_on_launch', 'equalto', true)
            | map(attribute='subnet_id')
            | list
            | first
            | default('')
          }}
      when:
        - deploy_subnet_id is not defined or deploy_subnet_id | length == 0
        - target_subnets is not skipped
        - target_subnets.subnets | length > 0

    - name: Fall back to any subnet in target VPC
      ansible.builtin.set_fact:
        deploy_subnet_id: "{{ target_subnets.subnets | map(attribute='subnet_id') | list | first | default('') }}"
      when:
        - deploy_subnet_id is not defined or deploy_subnet_id | length == 0
        - target_subnets is not skipped
        - target_subnets.subnets | length > 0

    - name: Fail when no subnet is available
      ansible.builtin.fail:
        msg: |
          No subnet available in VPC {{ deploy_vpc_id }} (region {{ aws_target_region }}).

          Set extra var aws_target_subnet_id to a subnet that can reach the internet
          (public subnet with map-public-ip-on-launch, or a private subnet with routing as required).
      when: deploy_subnet_id is not defined or deploy_subnet_id | length == 0

    - name: Ensure SSH key pair exists in target region
      amazon.aws.ec2_key:
        name: "{{ key_pair_name }}"
        region: "{{ aws_target_region }}"
        key_material: "{{ aws_instance_public_key }}"
        state: present

    - name: Ensure security group exists in target region
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "Migration security group for {{ resource_prefix }}"
        region: "{{ aws_target_region }}"
        vpc_id: "{{ deploy_vpc_id }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH
          - proto: tcp
            ports:
              - 80
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTP
          - proto: tcp
            ports:
              - 8080
            cidr_ip: 0.0.0.0/0
            rule_desc: Flask HTTP
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow all outbound
        state: present

    - name: Launch migrated EC2 instance from copied AMI
      amazon.aws.ec2_instance:
        name: "{{ instance_name_tag }}"
        region: "{{ aws_target_region }}"
        state: present
        image_id: "{{ deploy_ami_id }}"
        instance_type: "{{ aws_instance_size }}"
        key_name: "{{ key_pair_name }}"
        vpc_subnet_id: "{{ deploy_subnet_id }}"
        security_group: "{{ security_group_name }}"
        network:
          assign_public_ip: true
        wait: true
        wait_timeout: "{{ instance_launch_wait_timeout | default(600) }}"
        tags:
          Name: "{{ instance_name_tag }}"
          Provisioner: Ansible-Migration
          Manager: Ansible
          SourceAMI: "{{ source_ami_id }}"
          SourceRegion: "{{ aws_source_region }}"
          MigratedAMI: "{{ deploy_ami_id }}"
      register: migrated_instance

    - name: Show migration result
      ansible.builtin.debug:
        msg:
          - "Source AMI {{ source_ami_id }} ({{ aws_source_region }})"
          - "Target AMI {{ deploy_ami_id }} ({{ aws_target_region }})"
          - "New instance id: {{ migrated_instance.instance_ids[0] | default('unknown') }}"
          - "New public IP: {{ migrated_instance.instances[0].public_ip_address | default(migrated_instance.instances[0].public_ip | default('pending')) }}"
          - "New public DNS: {{ migrated_instance.instances[0].public_dns_name | default('pending') }}"
          - "VPC: {{ deploy_vpc_id }}  Subnet: {{ deploy_subnet_id }}"
          - "Security group: {{ security_group_name }}  Key pair: {{ key_pair_name }}"
          - "Test: curl http://{{ migrated_instance.instances[0].public_ip_address | default(migrated_instance.instances[0].public_ip | default('<public-ip>')) }}/"
          - "After validation, destroy the old region stack only (keep aws_source_region in destroy job)."

    - name: Publish migrated instance details for downstream workflow jobs
      ansible.builtin.set_stats:
        data:
          migrated_instance_id: "{{ migrated_instance.instance_ids[0] }}"
          migrated_public_ip: "{{ migrated_instance.instances[0].public_ip_address | default(migrated_instance.instances[0].public_ip | default('')) }}"
          migrated_public_dns: "{{ migrated_instance.instances[0].public_dns_name | default('') }}"
          deploy_ami_id: "{{ deploy_ami_id }}"
          aws_target_region: "{{ aws_target_region }}"
        per_host: false
