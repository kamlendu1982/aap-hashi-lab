---
- name: Manage aws resources using Terraform
  hosts: all
  gather_facts: false
  vars:
    working_dir_name: "{{ input_tf_working_dir_name | default('provision_tf_resources') }}"
    tf_plan_file_name: "{{ input_tf_plan_file_name | default('provision_tf_resources.tf') }}"
    tf_vars_file_name: "{{ input_tf_vars_file_name | default('provision_tf_resources.auto.tfvars') }}"
    cloud_provider: "{{ input_cloud_provider | default('AWS') }}"
    tf_working_dir: "/var/terraform/plans/{{ working_dir_name }}"
    aws_ami_id: "ami-035032ea878eca201"  # RHEL 9.7 public AMI
    tf_process_env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('', true) }}"
      AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('', true) }}"
      AWS_SESSION_TOKEN: "{{ lookup('env', 'AWS_SESSION_TOKEN') | default('', true) }}"
      AWS_DEFAULT_REGION: "{{ aws_region | default(lookup('env', 'AWS_DEFAULT_REGION') | default('', true)) }}"

  tasks:

  - name: Validate AWS credentials are available for Terraform
    ansible.builtin.assert:
      that:
        - tf_process_env.AWS_ACCESS_KEY_ID | length > 0
        - tf_process_env.AWS_SECRET_ACCESS_KEY | length > 0
        - tf_process_env.AWS_DEFAULT_REGION | length > 0
      fail_msg: >
        Attach an Amazon AWS credential to this job template, or ensure
        AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and aws_region are available.

  - name: Make sure working directory exists
    ansible.builtin.file:
      path: "{{ tf_working_dir }}"
      state: directory
      mode: '0755'

  - name: Copy the TF Plan
    ansible.builtin.template:
      src: "../TF_templates/{{ cloud_provider }}/{{ tf_plan_file_name }}.j2"
      dest: "{{ tf_working_dir }}/{{ tf_plan_file_name }}"

  - name: Copy the TF Vars Template
    ansible.builtin.template:
      src: "../TF_templates/{{ cloud_provider }}/{{ tf_vars_file_name }}.j2"
      dest: "{{ tf_working_dir }}/{{ tf_vars_file_name }}"

  - name: Initialize Terraform working directory
    ansible.builtin.command:
      cmd: terraform init -input=false
      chdir: "{{ tf_working_dir }}"
    environment: "{{ tf_process_env }}"
    changed_when: true

  - name: Apply Terraform configuration locally in the execution environment
    block:
      - name: Apply Terraform configuration locally in the execution environment
        ansible.builtin.command:
          cmd: terraform apply -auto-approve -input=false
          chdir: "{{ tf_working_dir }}"
        environment: "{{ tf_process_env }}"
        register: tf_apply

      - name: Display Terraform apply summary
        ansible.builtin.debug:
          msg: "{{ tf_apply.stdout_lines[-20:] | default([]) }}"
        when: tf_apply.stdout_lines is defined

      - name: Show Terraform outputs after apply
        ansible.builtin.command:
          cmd: terraform output
          chdir: "{{ tf_working_dir }}"
        environment: "{{ tf_process_env }}"
        register: tf_outputs
        changed_when: false

      - name: Display Terraform outputs
        ansible.builtin.debug:
          msg: "{{ tf_outputs.stdout_lines | default([]) }}"

    rescue:
      - name: Report local Terraform apply failure
        ansible.builtin.fail:
          msg: >
            Terraform apply failed in the AAP execution environment.
            {{ tf_apply.stderr | default('Check job output above for terraform errors.') }}
            Ensure the EE includes terraform, ansible-playbook, and openssh-clients.
