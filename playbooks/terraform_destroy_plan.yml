---
- name: Destroy a single aws resource using Terraform Cloud
  hosts: all
  gather_facts: false
  vars:
    # Pass in the specific instance name to remove, e.g. "instance-2"
    target_instance_name: "{{ input_target_instance_name }}"
    target_resource_address: 'aws_instance.Terraform_Demo_EC2["{{ target_instance_name }}"]'

  tasks:
    - name: Create a targeted destroy run to remove only the selected resource
      hashicorp.terraform.run:
        tf_hostname: "{{ tf_hostname }}"
        tf_validate_certs: false
        tf_token: "{{ tf_token }}"
        organization: "{{ tf_org }}"
        workspace: "{{ tf_workspace }}"
        run_message: "Targeted destroy of {{ target_resource_address }} by Ansible"
        is_destroy: true
        auto_apply: true
        target_addrs:
          - "{{ target_resource_address }}"
        poll_interval: 5
        poll_timeout: 360
        state: "present"
